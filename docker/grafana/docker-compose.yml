# Grafana stack for the sandbox: the app sends logs, traces (and optionally metrics) over OTLP to Alloy,
# which routes them to Loki (logs), Tempo (traces) and Prometheus (metrics); Grafana shows all three, linked by traceId.
#
#   docker compose -f docker/grafana/docker-compose.yml up -d
#   Grafana: http://localhost:3001  (admin / GRAFANA_ADMIN_PASSWORD, default "admin")
#   App (sandbox profile) sends to http://localhost:4318 by default: no app configuration needed.
#
# Only Grafana (3001) and Alloy (OTLP 4317/4318, UI 12345) are published, on 127.0.0.1 by default.
# Loki, Tempo and Prometheus have no authentication and stay on the internal network.
# On a shared sandbox host: BIND_ADDRESS=0.0.0.0 and a real GRAFANA_ADMIN_PASSWORD (see docs/opentelemetry-grafana.md).

name: ni-payment-grafana

services:
  alloy:
    image: grafana/alloy:v1.21.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:4317:4317"     # OTLP gRPC
      - "${BIND_ADDRESS:-127.0.0.1}:4318:4318"     # OTLP HTTP (the app's default)
      - "${BIND_ADDRESS:-127.0.0.1}:12345:12345"   # Alloy UI: pipeline graph and component health
    depends_on:
      - loki
      - tempo
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.19
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  # Tempo runs as user 10001: give it the data volume first (as in Grafana's own Tempo examples)
  tempo-init:
    image: grafana/tempo:2.10.10
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo

  tempo:
    image: grafana/tempo:2.10.10
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"   # 3000 is the sandbox client's return URL
    depends_on:
      - loki
      - tempo
      - prometheus
    restart: unless-stopped

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
