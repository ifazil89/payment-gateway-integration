openapi: 3.0.3
info:
  title: Payment API
  version: 1.0.0
  description: |
    Card payments for downstream clients, processed by N-Genius (Network International).

    **Two-stage:** `POST /api/v1/payments` only *authorises* (reserves) the money; capture is a separate API.

    **Next call depends on `status`:**

    | status | next |
    |---|---|
    | `AUTHORISED` | capture API |
    | `CHALLENGE_REQUIRED` | 3DS challenge (see below) |
    | `PENDING` | `GET /api/v1/orders/{orderReference}` (asks N-Genius), `GET /api/v1/payments/{paymentId}` later, or retry with the **same** `Idempotency-Key` |
    | `DECLINED` / `FAILED` | stop, or a new attempt with a new `Idempotency-Key` |

    **3DS challenge** (`CHALLENGE_REQUIRED`), with a `returnUrl` on the payment:
    1. `GET /api/v1/threeds/{paymentId}/challenge` returns the card issuer's challenge page as HTML
       (this service posts `creq` to N-Genius' `threeDSMethodURL`). Show it to the shopper, e.g. in a mobile WebView.
    2. After the challenge (e.g. an OTP), the issuer's ACS posts the form field `cres` to your `returnUrl`.
    3. Send it unchanged: `POST /api/v1/threeds/{paymentId}/challenge-response` `{"cres": "..."}`.
       The answer is the payment with its final status (`PENDING` if N-Genius did not answer: read it later
       with `GET /api/v1/payments/{paymentId}`).

    Without a `returnUrl`, post `threeDs.creq` to `threeDs.acsUrl` in the shopper's browser yourself; the ACS
    then posts the result to `POST /api/v1/threeds/{paymentId}/notification` and the browser sees a short
    "you can close this window" page. Read the final status with `GET /api/v1/payments/{paymentId}`.

    `returnUrl` must start with one of the return URLs configured for your client.

    **Tracing:** send `X-Correlation-Id` (optional). Every response returns `X-Correlation-Id` and `X-Trace-Id`;
    quote them when reporting a problem.

servers:
  - url: /

security:
  - apiKey: []

tags:
  - name: Payments
    description: Authorise card payments
  - name: 3DS
    description: The 3DS challenge after `CHALLENGE_REQUIRED`
  - name: Orders
    description: The live order status at N-Genius

paths:
  /api/v1/payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Authorise a payment with a new card or a saved card token
      description: |
        1. Creates an **AUTH** order at N-Genius.
        2. Sends the card (`CARD`) or the saved N-Genius token (`CARD_ON_FILE`).
        3. If N-Genius asks for 3DS, starts EMV 3DS 2.x with `deviceInfo`:
           frictionless -> `AUTHORISED`, challenge -> `CHALLENGE_REQUIRED` (with `threeDs`).

        The same `Idempotency-Key` returns the same payment: the card is never charged twice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            examples:
              card:
                summary: New card
                value:
                  merchantOrderId: SO-1001
                  cardType: CARD
                  returnUrl: https://shop.example.com/checkout/done?order=SO-1001
                  card: { pan: '4111111111111111', expiry: '2030-12', cvv: '123', cardholderName: Jane Doe }
                  amount: { value: 250.00, currency: AED }
                  billingInfo: { firstName: Jane, lastName: Doe, email: jane@example.com,
                                 address: Sheikh Zayed Road 1, city: Dubai, countryCode: AE }
                  deviceInfo: { ip: 203.0.113.10, userAgent: 'Mozilla/5.0', acceptHeader: text/html,
                                language: en, timeZoneOffset: '-240', screenWidth: '1440', screenHeight: '900',
                                colorDepth: '24', javascriptEnabled: true, javaEnabled: false }
              cardOnFile:
                summary: Saved card (N-Genius token)
                value:
                  merchantOrderId: SO-1002
                  cardType: CARD_ON_FILE
                  card: { token: '<saved-ni-card-token>', expiry: '2030-12', cvv: '123', cardholderName: Jane Doe }
                  amount: { value: 99.00, currency: AED }
                  billingInfo: { firstName: Jane, lastName: Doe, email: jane@example.com }
                  deviceInfo: { ip: 203.0.113.10, userAgent: 'Mozilla/5.0', acceptHeader: text/html, language: en }
      responses:
        '200':
          description: Processed. The outcome is in `status` (also for DECLINED / FAILED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/GatewayError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/payments/{paymentId}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Current status of a payment
      description: |
        The trusted status, e.g. after the shopper came back from a 3DS challenge or after `PENDING`.
        Only your own payments: another client's payment id is `404`.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderReference}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Live order status at N-Genius (retrieve order)
      description: |
        Asks N-Genius for the order's current state, for one of your own payments (`orderReference` from the
        payment response). Use it e.g. after `PENDING` (a timeout): if N-Genius already knows the outcome
        (`AUTHORISED`, `DECLINED`, `FAILED`), the payment is updated, so `GET /api/v1/payments/{paymentId}`
        shows it too. A known outcome is never changed, and a payment waiting for a 3DS challenge stays
        `CHALLENGE_REQUIRED`.

        `gatewayState` is N-Genius' raw payment state (e.g. `AWAIT_3DS`, `AUTHORISED`, `CAPTURED`), for support.
        On 422 / 502 / 504 nothing is changed: it is safe to call again.
      parameters:
        - name: orderReference
          in: path
          required: true
          schema:
            type: string
          description: The `orderReference` from the payment response
          example: cac88045-bec0-432a-8fdd-06902da874d2
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: ORDER_NOT_FOUND - unknown order reference (or another client's order)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: ORDER_NOT_FOUND
                message: No order cac88045-bec0-432a-8fdd-06902da874d2
                correlationId: demo-1
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                timestamp: '2026-10-28T08:25:08Z'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/GatewayError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/threeds/{paymentId}/challenge:
    get:
      tags: [3DS]
      operationId: getThreeDsChallengePage
      summary: The 3DS challenge page (HTML) to show the shopper
      description: |
        Only while the payment is `CHALLENGE_REQUIRED`. This service posts the form field `creq` to N-Genius'
        `threeDSMethodURL` and returns the HTML page as-is, with a `<base href>` added so its relative links
        still point to the 3DS server. Show it to the shopper, e.g. in a mobile WebView.
        After the challenge the ACS posts `cres` to your `returnUrl`; send it to
        `POST /api/v1/threeds/{paymentId}/challenge-response`.

        Nothing changes on the payment: it can be called again (e.g. on reload).
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The challenge page
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/GatewayError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/threeds/{paymentId}/challenge-response:
    post:
      tags: [3DS]
      operationId: submitThreeDsChallengeResponse
      summary: Send the challenge result (cres) the ACS posted to your returnUrl
      description: |
        The CRes is sent to N-Genius, which finishes the authentication. The answer is the payment:
        `AUTHORISED`, `DECLINED`, `FAILED`, or `PENDING` if N-Genius did not answer (read it later with
        `GET /api/v1/payments/{paymentId}`; the CRes is not sent again). A repeated call gets the current status.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeResponseRequest'
      responses:
        '200':
          description: The payment after the challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/threeds/{paymentId}/notification:
    post:
      tags: [3DS]
      operationId: threeDsNotification
      summary: 3DS challenge result (posted by the shopper's browser, payments without returnUrl)
      description: |
        The `notificationURL` given to the card issuer when the payment has no `returnUrl`. The issuer's ACS
        makes the shopper's browser post the challenge result (`cres`) here. **Not called by your backend; no API key.**

        The CRes is sent to N-Genius, then the browser is sent to the payment's `returnUrl`.
        If N-Genius does not answer, the status is `PENDING`: read it later with `GET /api/v1/payments/{paymentId}`.
        A repeated post does not reach N-Genius again; it gets the current status.
      security: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [cres]
              properties:
                cres:
                  type: string
                  description: Base64 challenge response from the card issuer's ACS
      responses:
        '303':
          description: Redirect to `returnUrl` with `paymentId` and `status` (`AUTHORISED`, `DECLINED`, `FAILED` or `PENDING`)
          headers:
            Location:
              schema:
                type: string
              example: https://shop.example.com/checkout/done?order=SO-1001&paymentId=7f3c2a9e-1b4d-4e8f-9a2b-3c4d5e6f7a8b&status=AUTHORISED
        '200':
          description: No `returnUrl` on the payment - a short HTML page ("Payment authorised. You can close this window.")
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Per-client API key

  parameters:
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
      description: The `paymentId` from the payment response
      example: 7f3c2a9e-1b4d-4e8f-9a2b-3c4d5e6f7a8b
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per payment attempt. Reuse the same value when retrying the same attempt.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: SO-1001-attempt-1

  responses:
    BadRequest:
      description: VALIDATION_ERROR (with field errors), MALFORMED_REQUEST, MISSING_HEADER
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            validationError:
              summary: Field validation failed (card fields do not match cardType)
              value:
                code: VALIDATION_ERROR
                message: Request validation failed
                correlationId: demo-1
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                timestamp: '2026-10-24T07:00:01.412Z'
                errors:
                  - { field: card.token, message: is required for cardType CARD_ON_FILE }
                  - { field: card.pan, message: must be empty for cardType CARD_ON_FILE }
            schemaError:
              summary: Format error from the schema
              value:
                code: VALIDATION_ERROR
                message: Request validation failed
                correlationId: demo-1
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                timestamp: '2026-10-24T07:00:01.412Z'
                errors:
                  - { field: card.expiry, message: 'must match "^\d{4}-(0[1-9]|1[0-2])$"' }
                  - { field: billingInfo.email, message: must be a well-formed email address }
            malformedRequest:
              summary: Body is not valid JSON or has an unknown enum value
              value:
                code: MALFORMED_REQUEST
                message: Request body is not valid JSON or has a wrong value (e.g. unknown cardType)
                correlationId: demo-1
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                timestamp: '2026-10-24T07:00:01.412Z'
            missingHeader:
              summary: Idempotency-Key header missing
              value:
                code: MISSING_HEADER
                message: Header Idempotency-Key is required
                correlationId: demo-1
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                timestamp: '2026-10-24T07:00:01.412Z'
    Unauthorized:
      description: UNAUTHORIZED - missing or invalid X-Api-Key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: UNAUTHORIZED
            message: Missing or invalid X-Api-Key
            correlationId: demo-1
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            timestamp: '2026-10-24T07:00:01.412Z'
    NotFound:
      description: PAYMENT_NOT_FOUND - unknown payment id (or another client's payment)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: PAYMENT_NOT_FOUND
            message: No payment 7f3c2a9e-1b4d-4e8f-9a2b-3c4d5e6f7a8b
            correlationId: demo-1
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            timestamp: '2026-10-24T07:00:01.412Z'
    Conflict:
      description: IDEMPOTENCY_KEY_REUSED (same key, different request), REQUEST_IN_PROGRESS, or CHALLENGE_NOT_REQUIRED (no 3DS challenge to show)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            keyReused:
              summary: Same Idempotency-Key, different request
              value:
                code: IDEMPOTENCY_KEY_REUSED
                message: This Idempotency-Key was already used for a different request
                correlationId: demo-1
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                timestamp: '2026-10-24T07:00:01.412Z'
            inProgress:
              summary: Same Idempotency-Key sent twice at the same moment
              value:
                code: REQUEST_IN_PROGRESS
                message: A request with this Idempotency-Key is already being processed
                correlationId: demo-1
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                timestamp: '2026-10-24T07:00:01.412Z'
    Unprocessable:
      description: INVALID_AMOUNT (e.g. 3 decimals for AED, unknown currency), GATEWAY_REJECTED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: INVALID_AMOUNT
            message: AED allows 2 decimals, got 10.001
            correlationId: demo-1
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            timestamp: '2026-10-24T07:00:01.412Z'
    InternalError:
      description: INTERNAL_ERROR
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: INTERNAL_ERROR
            message: Unexpected error
            correlationId: demo-1
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            timestamp: '2026-10-24T07:00:01.412Z'
    GatewayError:
      description: GATEWAY_ERROR - N-Genius returned a server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: GATEWAY_ERROR
            message: N-Genius returned an error
            correlationId: demo-1
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            timestamp: '2026-10-24T07:00:01.412Z'
    GatewayTimeout:
      description: GATEWAY_TIMEOUT - N-Genius did not answer; outcome UNKNOWN. Retry with the SAME Idempotency-Key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: GATEWAY_TIMEOUT
            message: N-Genius did not answer; the outcome is unknown. Retry with the same Idempotency-Key.
            correlationId: demo-1
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            timestamp: '2026-10-24T07:00:01.412Z'

  schemas:
    PaymentRequest:
      type: object
      required: [merchantOrderId, cardType, card, amount, billingInfo, deviceInfo]
      properties:
        merchantOrderId:
          type: string
          minLength: 1
          maxLength: 64
          description: Your order id (sent to N-Genius as merchantOrderReference)
          example: SO-1001
        cardType:
          $ref: '#/components/schemas/CardType'
        card:
          $ref: '#/components/schemas/CardInfo'
        amount:
          $ref: '#/components/schemas/Amount'
        billingInfo:
          $ref: '#/components/schemas/BillingInfo'
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'
        returnUrl:
          type: string
          maxLength: 2048
          description: |
            Where the shopper's browser goes after a 3DS challenge (`paymentId` and `status` are added as
            query parameters). Must start with one of the return URLs configured for your client; otherwise
            `400 VALIDATION_ERROR` on `returnUrl`. Optional: without it the shopper sees a short result page.
          example: https://shop.example.com/checkout/done?order=SO-1001

    CardType:
      type: string
      enum: [CARD, CARD_ON_FILE]
      description: |
        CARD = new card (pan required, token empty).
        CARD_ON_FILE = saved N-Genius card token (token required, pan empty).

    CardInfo:
      type: object
      description: One card object for both card types; `cardType` decides which fields are required.
      required: [expiry, cvv, cardholderName]
      properties:
        pan:
          type: string
          pattern: '^\d{12,19}$'
          description: Card number, digits only. CARD only.
          example: '4111111111111111'
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: Saved N-Genius card token. CARD_ON_FILE only.
        expiry:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: YYYY-MM
          example: '2030-12'
        cvv:
          type: string
          pattern: '^\d{3,4}$'
          example: '123'
        cardholderName:
          type: string
          minLength: 1
          maxLength: 100
          example: Jane Doe

    Amount:
      type: object
      required: [value, currency]
      description: MAJOR units (AED 250.00). Max decimals = the currency's decimals (AED 2, KWD 3).
      properties:
        value:
          type: number
          minimum: 0.001
          example: 250.00
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217
          example: AED

    BillingInfo:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 60, example: Jane }
        lastName: { type: string, minLength: 1, maxLength: 60, example: Doe }
        email: { type: string, format: email, maxLength: 254, example: jane@example.com }
        address: { type: string, maxLength: 200, example: Sheikh Zayed Road 1 }
        city: { type: string, maxLength: 60, example: Dubai }
        countryCode: { type: string, pattern: '^[A-Z]{2}$', description: ISO 3166-1 alpha-2, example: AE }

    DeviceInfo:
      type: object
      description: Shopper's browser data, used for EMV 3DS 2.x when N-Genius asks for 3DS.
      required: [ip, userAgent, acceptHeader, language]
      properties:
        ip: { type: string, minLength: 1, maxLength: 45, example: 203.0.113.10 }
        userAgent: { type: string, minLength: 1, maxLength: 2048, example: 'Mozilla/5.0' }
        acceptHeader: { type: string, minLength: 1, maxLength: 2048, example: text/html }
        language: { type: string, minLength: 1, maxLength: 8, example: en }
        timeZoneOffset: { type: string, pattern: '^-?\d{1,4}$', description: 'new Date().getTimezoneOffset() (UTC+4 = -240)', example: '-240' }
        screenWidth: { type: string, pattern: '^\d{1,6}$', example: '1440' }
        screenHeight: { type: string, pattern: '^\d{1,6}$', example: '900' }
        colorDepth: { type: string, pattern: '^\d{1,2}$', example: '24' }
        javascriptEnabled: { type: boolean, example: true }
        javaEnabled: { type: boolean, example: false }
        challengeWindowSize:
          type: string
          pattern: '^0[1-5]$'
          description: 01=250x400, 02=390x400, 03=500x600, 04=600x400, 05=full screen (default)
          example: '05'

    PaymentResponse:
      type: object
      required: [paymentId, merchantOrderId, status, amount, createdAt]
      properties:
        paymentId:
          type: string
          description: Our payment id - use it in the next API call
          example: 7f3c2a9e-1b4d-4e8f-9a2b-3c4d5e6f7a8b
        merchantOrderId:
          type: string
          example: SO-1001
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          $ref: '#/components/schemas/Amount'
        orderReference:
          type: string
          description: N-Genius order reference (support / reconciliation)
        failureReason:
          type: string
          description: Why the payment was declined or failed
        createdAt:
          type: string
          format: date-time
        threeDs:
          $ref: '#/components/schemas/ThreeDsChallenge'

    OrderStatusResponse:
      type: object
      required: [orderReference, paymentId, merchantOrderId, status]
      properties:
        orderReference:
          type: string
          description: N-Genius order reference
          example: cac88045-bec0-432a-8fdd-06902da874d2
        paymentId:
          type: string
          description: Our payment id for this order
          example: 7f3c2a9e-1b4d-4e8f-9a2b-3c4d5e6f7a8b
        merchantOrderId:
          type: string
          example: SO-1001
        action:
          type: string
          description: N-Genius order action (`AUTH` = two-stage)
          example: AUTH
        amount:
          $ref: '#/components/schemas/Amount'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        gatewayState:
          type: string
          description: N-Genius' raw payment state, for support
          example: AUTHORISED
        cardBrand:
          type: string
          example: VISA
        maskedPan:
          type: string
          example: 411111******1111
        orderCreatedAt:
          type: string
          format: date-time
          description: When N-Genius created the order
        updatedAt:
          type: string
          format: date-time
          description: Last change of the payment at N-Genius

    ChallengeResponseRequest:
      type: object
      required: [cres]
      properties:
        cres:
          type: string
          minLength: 1
          maxLength: 20000
          description: The form field `cres` the card issuer's ACS posted to your `returnUrl`, unchanged
          example: eyJ0cmFuc1N0YXR1cyI6IlkiLCJtZXNzYWdlVHlwZSI6IkNSZXMifQ==

    ThreeDsChallenge:
      type: object
      description: |
        Only when `status` is `CHALLENGE_REQUIRED`. With a `returnUrl`, get the page from
        `GET /api/v1/threeds/{paymentId}/challenge` instead. Otherwise, in the shopper's browser, POST a form
        with the field `creq` (this `creq` value) to `acsUrl`:

        ```html
        <form method="post" action="{acsUrl}"><input type="hidden" name="creq" value="{creq}"></form>
        <script>document.forms[0].submit()</script>
        ```
      required: [acsUrl, creq]
      properties:
        acsUrl:
          type: string
          description: The card issuer's challenge page (ACS)
          example: https://acs.bank.example/challenge
        creq:
          type: string
          description: Base64 challenge request, posted as the form field `creq`
          example: eyJ0aHJlZURTU2VydmVyVHJhbnNJRCI6Ii4uLiJ9

    PaymentStatus:
      type: string
      enum: [AUTHORISED, CHALLENGE_REQUIRED, PENDING, DECLINED, FAILED]

    ErrorResponse:
      type: object
      description: Returned for every non-200 response. `errors` is present only for VALIDATION_ERROR.
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: |
            VALIDATION_ERROR, MALFORMED_REQUEST, MISSING_HEADER, UNAUTHORIZED, IDEMPOTENCY_KEY_REUSED,
            REQUEST_IN_PROGRESS, CHALLENGE_NOT_REQUIRED, ORDER_NOT_FOUND, INVALID_AMOUNT, GATEWAY_REJECTED, GATEWAY_ERROR, GATEWAY_TIMEOUT, REQUEST_ERROR,
            INTERNAL_ERROR
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request validation failed
        correlationId:
          type: string
          description: X-Correlation-Id of the request (sent by you or generated). Quote it when reporting a problem.
          example: demo-1
        traceId:
          type: string
          description: Distributed trace id (also in the X-Trace-Id response header)
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        timestamp:
          type: string
          format: date-time
          example: '2026-10-24T07:00:01.412Z'
        errors:
          type: array
          description: One entry per invalid field (VALIDATION_ERROR only)
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      description: One invalid field
      required: [field, message]
      properties:
        field: { type: string, example: card.pan }
        message: { type: string, example: is required for cardType CARD }
