# Human-readable console logs WITH every field (bodies too) for local debugging:
#   mvn spring-boot:run -Dspring-boot.run.profiles=sandbox,plainlogs
# (The sandbox console alone shows only the message lines; this adds the fields below each one.)
# Each line: time level [traceId,spanId] [correlationId] [clientId] [paymentId] logger : message + fields
logging:
  structured:
    format:
      console: ""
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{traceId:-},%X{spanId:-}] [%X{correlationId:-}] [%X{clientId:-}] [%X{paymentId:-}] %-40.40logger{39} : %m%n    %kvp%n"
