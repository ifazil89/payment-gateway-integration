# Sandbox (default profile): N-Genius sandbox + in-memory H2.
# Only NI_API_KEY and NI_OUTLET_ID must be provided.
ni:
  base-url: ${NI_BASE_URL:https://api-gateway.sandbox.ngenius-payments.com}
  threeds-notification-url: ${NI_THREEDS_NOTIFICATION_URL:http://localhost:8085/api/v1/threeds/{paymentId}/notification}

app:
  security:
    api-keys: ${API_KEYS:local-client:sandbox-key}
    return-urls: ${RETURN_URLS:local-client:http://localhost:3000/}

spring:
  datasource:
    url: jdbc:h2:mem:payment;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:

# Console: one short readable line per event (no fields, no bodies), to follow a payment step by step.
# Every field and the masked bodies are still in the rolling file (JSON) and in Grafana.
#   LOG_CONSOLE_FORMAT=ecs        the full JSON on the console as well
#   profile plainlogs             readable lines plus every field (bodies too)
logging:
  structured:
    format:
      console: ${LOG_CONSOLE_FORMAT:}
    ecs:
      service:
        environment: sandbox
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{correlationId:-}] [%X{paymentId:-}] %-30.30logger{29} : %m%n"

# Logs to Grafana over OTLP/HTTP (sandbox only; production has no Grafana yet). Any OTLP receiver works:
#   Loki 3 (http://<loki>:3100/otlp/v1/logs), Alloy / OpenTelemetry collector (http://<host>:4318/v1/logs),
#   Grafana Cloud (OTLP gateway URL + MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_HEADERS_AUTHORIZATION="Basic ...").
# GRAFANA_LOGS_ENABLED=false switches it off (e.g. locally without Grafana).
management:
  logging:
    export:
      otlp:
        enabled: ${GRAFANA_LOGS_ENABLED:true}
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${GRAFANA_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
    resource-attributes:
      deployment.environment.name: sandbox
